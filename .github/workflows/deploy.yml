name: Build & deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npx astro build
      # A tar of dist/ (dotfiles included, so /.well-known/ ships) for deploy-cloudflare
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  # Cloudflare Pages hosts the site (docs/cloudflare-pages.md). Needs the
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
  deploy-cloudflare:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: workswithwhat
          WRANGLER: wrangler@4.151.1
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets missing; nothing deployed"
            exit 1
          fi
          mkdir dist && tar -xf artifact.tar -C dist
          # First run creates the project; later runs find it already there
          npx --yes "$WRANGLER" pages project list | grep -qw "$PROJECT" \
            || npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch=main
          npx --yes "$WRANGLER" pages deploy dist --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*\.pages\.dev' deploy.log | tail -1)
          echo "Deployed to $url"
          # Smoke test the deployment itself, before or after the DNS switch.
          # A new deployment's TLS certificate can take a few minutes to appear.
          get() { curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url$1" || true; }
          for i in $(seq 1 24); do
            [ "$(get /)" = 200 ] && break
            echo "waiting for $url ($i)"; sleep 15
          done
          fails=0
          for p in / /smart-plugs/ /es/ /.well-known/security.txt /robots.txt /api/devices.json; do
            code=$(get "$p")
            echo "$p -> $code"; [ "$code" = 200 ] || fails=$((fails + 1))
          done
          code=$(get /this-page-does-not-exist/)
          echo "/this-page-does-not-exist/ -> $code"; [ "$code" = 404 ] || fails=$((fails + 1))
          curl -sSI --max-time 20 "$url/" | grep -qi '^x-frame-options:' || { echo "_headers not applied"; fails=$((fails + 1)); }
          [ "$fails" = 0 ]

  # Tell IndexNow engines (Bing, Yandex, …) which URLs exist after each deploy.
  # The key is public by design: it is also served at /b065f34bf6c2a7a6c90cf76a5ada5c02.txt.
  indexnow:
    needs: deploy-cloudflare
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs
        env:
          KEY: b065f34bf6c2a7a6c90cf76a5ada5c02
        run: |
          # Payload goes through a file: 3,000+ URLs overflow the argument list
          curl -sSf https://workswithwhat.com/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' \
            | jq -R . | jq -s --arg key "$KEY" \
              '{host: "workswithwhat.com", key: $key, keyLocation: "https://workswithwhat.com/\($key).txt", urlList: .}' > payload.json
          echo "Submitting $(jq '.urlList | length' payload.json) URLs"
          curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data-binary @payload.json
