name: Build & deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npx astro build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare Pages: the new host (docs/cloudflare-pages.md). GitHub Pages keeps
  # deploying as a fallback until the DNS switch is confirmed. Skipped until the
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
  deploy-cloudflare:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: workswithwhat
          WRANGLER: wrangler@4.151.1
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set; Cloudflare Pages deploy skipped"
            exit 0
          fi
          mkdir dist && tar -xf artifact.tar -C dist
          # First run creates the project; later runs find it already there
          npx --yes "$WRANGLER" pages project list | grep -qw "$PROJECT" \
            || npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch=main
          npx --yes "$WRANGLER" pages deploy dist --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" | tee deploy.log
          url=$(grep -o 'https://[a-z0-9.-]*\.pages\.dev' deploy.log | tail -1)
          echo "Deployed to $url"
          # Smoke test the deployment itself, before or after the DNS switch
          sleep 15
          fails=0
          for p in / /smart-plugs/ /es/ /.well-known/security.txt /robots.txt /api/devices.json; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$url$p")
            echo "$p -> $code"; [ "$code" = 200 ] || fails=$((fails + 1))
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url/this-page-does-not-exist/")
          echo "/this-page-does-not-exist/ -> $code"; [ "$code" = 404 ] || fails=$((fails + 1))
          curl -sSI "$url/" | grep -qi '^x-frame-options:' || { echo "_headers not applied"; fails=$((fails + 1)); }
          [ "$fails" = 0 ]

  # Tell IndexNow engines (Bing, Yandex, …) which URLs exist after each deploy.
  # The key is public by design: it is also served at /b065f34bf6c2a7a6c90cf76a5ada5c02.txt.
  indexnow:
    needs: [deploy, deploy-cloudflare]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs
        env:
          KEY: b065f34bf6c2a7a6c90cf76a5ada5c02
        run: |
          urls=$(curl -sSf https://workswithwhat.com/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          echo "Submitting $(echo "$urls" | jq length) URLs"
          curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"workswithwhat.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://workswithwhat.com/$KEY.txt\",\"urlList\":$urls}"
